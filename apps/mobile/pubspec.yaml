name: halisaha
description: Rövanş - halı saha rezervasyon uygulaması (müşteri ve işletmeci).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.4
  supabase_flutter: ^2.8.0
  webview_flutter: ^4.10.0
  # flutter_localizations pins intl to the version shipped with the Flutter SDK.
  # 0.20.x matches Flutter >= 3.32; use ^0.19.0 on older SDKs.
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
