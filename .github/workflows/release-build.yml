name: Release build

# Android: signed App Bundle (Play Store) + APK (direct install).
# iOS: release build without code signing (proves it compiles; signing needs the paid Apple account).
# Secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY            (optional — without them a DEMO build is produced)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::No upload key secret: building with debug signing (not uploadable to Play)"; exit 0; fi
          echo "$KS" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
      - name: Build config
        env:
          URL: ${{ secrets.PROD_SUPABASE_URL }}
          ANON: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$ANON" ]; then
            python3 -c "import json,os;json.dump({'SUPABASE_URL':os.environ['URL'],'SUPABASE_ANON_KEY':os.environ['ANON'],'DEMO_MODE':'false'},open('env/ci.json','w'))"
            echo "FLAVOR=prod" >> $GITHUB_ENV
          else
            echo '{"DEMO_MODE":"true"}' > env/ci.json
            echo "FLAVOR=demo" >> $GITHUB_ENV
            echo "::notice::No production Supabase secrets: building the DEMO app"
          fi
      - run: flutter pub get
      - name: Build (obfuscated)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define-from-file=env/ci.json
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define-from-file=env/ci.json
          mkdir -p ../../dist
          cp build/app/outputs/bundle/release/app-release.aab ../../dist/rovans-${FLAVOR}.aab
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/rovans-${FLAVOR}.apk
          tar -czf ../../dist/symbols-android-${FLAVOR}.tgz build/symbols
          rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.FLAVOR }}
          path: dist/
      - name: Publish GitHub pre-release (APK for direct install)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/rovans-${FLAVOR}.apk dist/rovans-${FLAVOR}.aab \
            --prerelease --title "Rövanş ${FLAVOR} build ${GITHUB_RUN_NUMBER}" \
            --notes "Android APK (doğrudan kurulum) ve AAB (Play Console). Sürüm: ${GITHUB_SHA::7}. Mod: ${FLAVOR}."

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: echo '{"DEMO_MODE":"true"}' > env/ci.json
      - run: flutter pub get
      - name: iOS release build (no code signing)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols --dart-define-from-file=env/ci.json
