name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure PostgreSQL (preinstalled on GitHub Ubuntu runners)
        run: |
          ls -d /usr/lib/postgresql/*/bin || (sudo apt-get update -q && sudo apt-get install -yq postgresql postgresql-contrib)
          ls -d /usr/lib/postgresql/*/bin
      - name: SQL tests
        run: ./supabase/tests/run_local.sh

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Infos are reported but not fatal (Flutter 3.47 deprecates package:flutter/material.dart; migration tracked in DECISIONS.md ADR-7)
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  owner-panel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/owner_panel } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Report resolved versions
        run: |
          npm ls @supabase/ssr @supabase/supabase-js @supabase/postgrest-js next typescript || true
          echo "latest ssr: $(npm view @supabase/ssr version)  latest supabase-js: $(npm view @supabase/supabase-js version)"
      - run: npm run typecheck
      - run: npm run lint

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets committed
        run: |
          ! git grep -nE "(service_role|SERVICE_ROLE)[^\n]*eyJhbGci|(^|[^a-z_])merchant_key\s*[:=]\s*['\"][A-Za-z0-9]{8,}|sk_live_" -- . ':!*.md' ':!.github/**'
